name: Rail data build (GTFS)

# Mode 2 job (docs/ARCHITECTURE.md §2.2): the Swiss GTFS is published Monday and Thursday around
# 09:00–10:00 CET and the realtime feed switches to it at 15:00. We build at 16:30 CET so the
# rail files always match the feed. Output is uploaded as a workflow artifact until Vercel Blob
# is wired in (FREE_TIER_ARCHITECTURE.md); the local dev setup runs the same two commands.
on:
  schedule:
    - cron: "30 14 * * 1,4" # 16:30 CEST / 15:30 CET
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build rail files from the newest GTFS (streams the 248 MB archive)
        run: pnpm --filter @swiss-now/core build-gtfs -- --out "$GITHUB_WORKSPACE/out/rail" --days 7
      - name: Build route paths on the BAV railway network
        run: pnpm --filter @swiss-now/core build-rail-paths -- --rail "$GITHUB_WORKSPACE/out/rail" --network bav
      - name: Upload to Vercel Blob (skipped until BLOB_READ_WRITE_TOKEN is configured)
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: pnpm --filter @swiss-now/core upload-rail -- --rail "$GITHUB_WORKSPACE/out/rail"
      - name: Summary
        run: |
          cat out/rail/meta.json
          du -sh out/rail/paths out/rail/days
      - uses: actions/upload-artifact@v4
        with:
          name: rail-${{ github.run_id }}
          path: |
            out/rail/meta.json
            out/rail/stops.json
            out/rail/routes.json
            out/rail/patterns.json
            out/rail/distances.json
            out/rail/days/
            out/rail/paths/
          retention-days: 7
