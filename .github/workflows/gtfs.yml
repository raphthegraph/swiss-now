name: Rail data build (GTFS)

# Mode 2 job (docs/ARCHITECTURE.md §2.2): the Swiss GTFS is published Monday and Thursday around
# 09:00–10:00 CET and the realtime feed switches to it at 15:00. We build at 16:30 CET so the
# rail files always match the feed. Output is published to the orphan branch `rail-data`, which
# GitHub Pages serves at https://raphthegraph.github.io/swiss-now/ (the web reads RAIL_DATA_URL);
# no Blob operations, so the Hobby quota stays for the snapshots. Local dev runs the same two commands.
on:
  schedule:
    - cron: "30 14 * * 1,4" # 16:30 CEST / 15:30 CET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build rail files from the newest GTFS (streams the 248 MB archive)
        run: pnpm --filter @swiss-now/core build-gtfs -- --out "$GITHUB_WORKSPACE/out/rail" --days 7
      - name: Build route paths on the BAV railway network
        run: pnpm --filter @swiss-now/core build-rail-paths -- --rail "$GITHUB_WORKSPACE/out/rail" --network bav
      - name: Publish to the rail-data branch (served by GitHub Pages)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/out/rail"
          rm -f ./*.zip   # the downloaded GTFS archive is not part of the published files
          touch .nojekyll
          git init -q -b rail-data
          git config user.name "swiss-now-data"
          git config user.email "data@users.noreply.github.com"
          git add -A
          git commit -qm "rail data $(date -u +%F) · $(node -e 'console.log(require("./meta.json").feedVersion)')"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" rail-data
      - name: Summary
        run: |
          cat out/rail/meta.json
          du -sh out/rail/paths out/rail/days
      - uses: actions/upload-artifact@v4
        with:
          name: rail-${{ github.run_id }}
          path: |
            out/rail/meta.json
            out/rail/stops.json
            out/rail/routes.json
            out/rail/patterns.json
            out/rail/distances.json
            out/rail/days/
            out/rail/paths/
          retention-days: 7
